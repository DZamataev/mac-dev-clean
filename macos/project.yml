name: MacDevClean

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SWIFT_VERSION: "6.0"

targets:
  MacDevCleanApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    productName: mac-dev-clean
    sources:
      - path: Sources/MacDevCleanApp
      - path: AppBundle/AppIcon.icns
        buildPhase: resources
      - path: ../assets/mac-dev-clean-logo.png
        buildPhase: resources
        group: mac-dev-clean/assets
      - path: ../raven_vector_logos/raven-vector-dark.png
        buildPhase: resources
        group: mac-dev-clean/raven_vector_logos
      - path: ../raven_vector_logos/raven-vector-dark-trans.png
        buildPhase: resources
        group: mac-dev-clean/raven_vector_logos
      - path: ../LICENSE
        buildPhase: resources
        group: mac-dev-clean
      - path: ../BRANDING.md
        buildPhase: resources
        group: mac-dev-clean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravenvector.mac-dev-clean
        PRODUCT_NAME: mac-dev-clean
        PRODUCT_MODULE_NAME: MacDevCleanApp
        EXECUTABLE_NAME: MacDevCleanApp
        INFOPLIST_FILE: AppBundle/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
    postBuildScripts:
      - name: Bundle Python cleanup engine
        inputFiles:
          - $(SRCROOT)/../src/mac_dev_clean/__init__.py
          - $(SRCROOT)/../src/mac_dev_clean/__main__.py
          - $(SRCROOT)/../src/mac_dev_clean/age.py
          - $(SRCROOT)/../src/mac_dev_clean/cleaner.py
          - $(SRCROOT)/../src/mac_dev_clean/cli.py
          - $(SRCROOT)/../src/mac_dev_clean/deep_scan.py
          - $(SRCROOT)/../src/mac_dev_clean/discovery.py
          - $(SRCROOT)/../src/mac_dev_clean/events.py
          - $(SRCROOT)/../src/mac_dev_clean/executor.py
          - $(SRCROOT)/../src/mac_dev_clean/fsevents.py
          - $(SRCROOT)/../src/mac_dev_clean/index.py
          - $(SRCROOT)/../src/mac_dev_clean/journal.py
          - $(SRCROOT)/../src/mac_dev_clean/model.py
          - $(SRCROOT)/../src/mac_dev_clean/ndk_usage.py
          - $(SRCROOT)/../src/mac_dev_clean/output.py
          - $(SRCROOT)/../src/mac_dev_clean/policy.py
          - $(SRCROOT)/../src/mac_dev_clean/projects.py
          - $(SRCROOT)/../src/mac_dev_clean/recommendation.py
          - $(SRCROOT)/../src/mac_dev_clean/scanner.py
          - $(SRCROOT)/../src/mac_dev_clean/sim_prune.py
          - $(SRCROOT)/../src/mac_dev_clean/tool_executor.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/__init__.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/android.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/docker.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/homebrew.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/registry.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/runner.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/simulator.py
          - $(SRCROOT)/../src/mac_dev_clean/tools/sizes.py
          - $(SRCROOT)/../src/mac_dev_clean/xcode_sim_prune.py
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/__init__.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/__main__.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/age.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/cleaner.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/cli.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/deep_scan.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/discovery.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/events.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/executor.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/fsevents.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/index.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/journal.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/model.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/ndk_usage.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/output.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/policy.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/projects.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/recommendation.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/scanner.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/sim_prune.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tool_executor.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/__init__.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/android.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/docker.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/homebrew.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/registry.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/runner.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/simulator.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/tools/sizes.py
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/python/mac_dev_clean/xcode_sim_prune.py
        script: |
          ENGINE_SOURCE="${SRCROOT}/../src/mac_dev_clean"
          case "${WRAPPER_NAME}" in
            ""|*/*|.|..|.app)
              echo "Refusing to replace unexpected Python engine destination." >&2
              exit 1
              ;;
            *.app) ;;
            *)
              echo "Refusing to replace unexpected Python engine destination." >&2
              exit 1
              ;;
          esac
          if [ -z "${TARGET_BUILD_DIR}" ]; then
            echo "Refusing to replace unexpected Python engine destination." >&2
            exit 1
          fi
          EXPECTED_RESOURCES_PATH="${WRAPPER_NAME}/Contents/Resources"
          if [ "${UNLOCALIZED_RESOURCES_FOLDER_PATH}" != "${EXPECTED_RESOURCES_PATH}" ]; then
            echo "Refusing to replace unexpected Python engine destination." >&2
            exit 1
          fi
          TARGET_BUILD_REAL=$(CDPATH='' cd -P -- "${TARGET_BUILD_DIR}" && pwd -P) || exit 1
          RESOURCES_DEST="${TARGET_BUILD_DIR}/${EXPECTED_RESOURCES_PATH}"
          RESOURCES_REAL=$(CDPATH='' cd -P -- "${RESOURCES_DEST}" && pwd -P) || exit 1
          if [ "${RESOURCES_REAL}" != "${TARGET_BUILD_REAL}/${EXPECTED_RESOURCES_PATH}" ]; then
            echo "Refusing to replace unexpected Python engine destination." >&2
            exit 1
          fi
          PYTHON_PARENT="${RESOURCES_DEST}/python"
          if [ -L "${PYTHON_PARENT}" ]; then
            echo "Refusing to replace unexpected Python engine destination." >&2
            exit 1
          fi
          /bin/mkdir -p "${PYTHON_PARENT}"
          PYTHON_PARENT_REAL=$(CDPATH='' cd -P -- "${PYTHON_PARENT}" && pwd -P) || exit 1
          if [ "${PYTHON_PARENT_REAL}" != "${RESOURCES_REAL}/python" ]; then
            echo "Refusing to replace unexpected Python engine destination." >&2
            exit 1
          fi
          ENGINE_DEST="${PYTHON_PARENT}/mac_dev_clean"
          /bin/rm -rf "${ENGINE_DEST}"
          /bin/mkdir -p "${ENGINE_DEST}/tools"
          /bin/cp "${ENGINE_SOURCE}"/*.py "${ENGINE_DEST}/"
          /bin/cp "${ENGINE_SOURCE}"/tools/*.py "${ENGINE_DEST}/tools/"
    scheme:
      gatherCoverageData: true
      testTargets:
        - MacDevCleanAppTests

  MacDevCleanAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/MacDevCleanAppTests
    dependencies:
      - target: MacDevCleanApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravenvector.mac-dev-clean.tests
        PRODUCT_NAME: MacDevCleanAppTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mac-dev-clean.app/Contents/MacOS/MacDevCleanApp
        CODE_SIGN_STYLE: Automatic
